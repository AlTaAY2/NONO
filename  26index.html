:root{--g:rgba(255,255,255,.17);--gb:rgba(255,255,255,.42);--bgm:radial-gradient(circle at 15% 10%,rgba(255,255,255,.28),transparent 38%),radial-gradient(circle at 90% 35%,rgba(255,150,120,.45),transparent 40%),radial-gradient(circle at 20% 90%,rgba(255,90,110,.5),transparent 45%),linear-gradient(170deg,var(--red-l),var(--red) 45%,var(--red-d))}

.mail textarea::placeholder{color:var(--mut)}
.cols{display:flex;gap:10px;margin-bottom:12px}.cols button{width:34px;height:34px;border-radius:50%;border:2px solid #fff;cursor:pointer}
.cols button.on{outline:3px solid var(--fg,#fff);outline-offset:2px}
.seg{display:flex;gap:8px;margin:8px 20px 12px}.seg button{flex:1;border:1px solid var(--gb);background:var(--g);color:var(--fg,#fff);border-radius:999px;padding:10px;font:700 15px 'Tajawal',sans-serif;cursor:pointer}.seg button.on{background:var(--btnbg,#fff);color:var(--btnfg,var(--red));border-color:transparent}
#sub{z-index:30;align-items:flex-start}[data-u]{cursor:pointer}
.av img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;z-index:1}
.fld{width:100%;border:1px solid var(--gb);background:var(--g);color:var(--fg,#fff);border-radius:22px;padding:13px 16px;font:500 16px 'Tajawal',sans-serif;outline:none;margin-bottom:8px;display:block;resize:none}.fld:focus-visible{box-shadow:0 0 0 2px var(--ring,#fff)}.fld::placeholder{color:var(--mut)}
.lbl{display:block;font-size:13px;color:var(--mut);margin:10px 6px 4px}.msg{min-height:20px;font-size:13px;font-weight:700;margin:0 6px 6px}
.eav{width:96px;height:96px;margin:0 auto 6px;cursor:pointer}.eav .av{width:100%;height:100%;font-size:38px}
.post{margin:0 16px 14px;padding:14px;border-radius:28px;background:var(--g);border:1px solid var(--gb);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);color:var(--fg,#fff);text-align:start}
#sub .post{margin-inline:0}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:10px}.ph .av{width:42px;height:42px;flex:none;border:0;font-size:17px}.ph b{display:block}.ph small{color:var(--mut)}
.pt{line-height:1.7;white-space:pre-wrap;word-break:break-word;margin-bottom:8px}.pimg{width:100%;border-radius:20px;display:block;margin-bottom:8px;max-height:420px;object-fit:cover}
.pa{display:flex;gap:4px;align-items:center}.pa button{background:none;border:0;color:var(--fg,#fff);font:700 14px 'Tajawal',sans-serif;cursor:pointer;padding:6px 10px;border-radius:999px;opacity:.85}.pa button.on{opacity:1;background:var(--g)}.pa .sp{flex:1}
.srow{display:flex;align-items:center;gap:12px;padding:10px 4px}.srow .m{flex:1}
.tg{width:52px;height:30px;border-radius:999px;border:1px solid var(--gb);background:var(--g);position:relative;cursor:pointer;flex:none;padding:0}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--fg,#fff);transition:transform .2s}
.tg.on{background:var(--btnbg,#fff)}.tg.on::after{transform:translateX(22px);background:var(--btnfg,var(--red))}
.stats button{background:var(--g);border:1px solid var(--gb);border-radius:26px;padding:10px 18px;color:var(--fg,#fff);font-family:inherit;cursor:pointer;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5)}.stats button b{display:block;font-size:20px}.stats button small{color:var(--mut)}
.pbio{margin:-8px 0 14px;line-height:1.6}.hp p{color:var(--mut);line-height:1.8;margin:2px 0 12px}
.vf{display:flex;gap:8px;padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px))}.vf input{flex:1;min-width:0;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:12px 16px;font:500 15px 'Tajawal',sans-serif;outline:none}.vf input::placeholder{color:rgba(255,255,255,.7)}
</style>
</head>
<body>
<div class="app">
  <div class="bub"><span></span><span></span><span></span><span></span><span></span></div>
  <div class="top"><div class="logo"><img data-ic="logo" alt="">NONO</div><div class="hbtn"><button class="btn ico" id="addc" aria-label="إضافة صديق">＋</button><button class="btn ico" id="bell" aria-label="الأصدقاء والطلبات">👥<b class="dot" id="dot" hidden></b></button></div></div>
  <main>
    <section class="screen on" id="s-chats">
      <div class="search"><input id="q" placeholder="ابحث عن محادثة..."></div>
      <div class="stories" id="strip"></div>
      <div class="sheet"><div id="list"></div></div>
    </section>
    <section class="screen" id="s-stories">
      <div class="seg"><button class="on" data-sg="st">القصص</button><button data-sg="po">المنشورات</button></div>
      <div id="sg-st">
      <div class="mail" style="margin-top:8px"><b>انشر قصة (تختفي بعد 24 ساعة)</b><textarea id="stx" maxlength="200" placeholder="شنو يدور براسك؟ تكدر تستخدم #هاشتاك"></textarea><div class="cols" id="cols"></div><button class="btn full" id="spost">نشر</button></div>
      <div class="sheet"><div class="h">القصص</div><div class="grid" id="grid"></div></div>
      </div>
      <div id="sg-po" hidden>
        <div class="mail" style="margin-top:0"><textarea class="fld" id="ptx" maxlength="500" rows="3" placeholder="شنو تفكر بي؟"></textarea><div id="pprev"></div><div class="mrow"><button class="btn g" id="pimg">📷 صورة</button><button class="btn" id="ppost">نشر</button></div></div>
        <div id="feed"></div>
      </div>
    </section>
    <section class="screen" id="s-prof">
      <div class="prof">
        <div class="big" id="pbig"></div>
        <h2 id="pname"></h2><p id="puser"></p><p class="pbio" id="pbio" hidden></p>
        <div class="stats"><button data-pp="friends"><b id="sf">0</b><small>صديق</small></button><button data-pp="followers"><b id="ss">0</b><small>متابع</small></button><button data-pp="following"><b id="sr">0</b><small>يتابع</small></button></div>
        <div class="acts"><button class="btn" data-x="edit">تعديل الملف</button><button class="btn" data-x="share">مشاركة</button></div>
      </div>
      <div class="mail"><div id="mst"></div><div class="mrow" id="mrow"><input id="pem" type="email" dir="ltr" placeholder="name@email.com"><button class="btn" id="psave">ربط</button></div></div>
      <div class="sheet"><div class="set">
        <button class="row" data-x="notif"><div class="ic">🔔</div><div class="m"><b>الإشعارات <span class="badge" id="nbadge" hidden></span></b></div></button>
        <button class="row" data-x="priv"><div class="ic">🔒</div><div class="m"><b>الخصوصية والأمان</b></div></button>
        <button class="row" data-x="saved"><div class="ic">🔖</div><div class="m"><b>المحفوظات</b></div></button>
        <button class="row" id="themeBtn"><div class="ic">🎨</div><div class="m"><b>المظهر</b></div></button>
        <button class="row" data-x="help"><div class="ic">💬</div><div class="m"><b>المساعدة</b></div></button>
        <button class="row" id="logout"><div class="ic">🚪</div><div class="m"><b>تسجيل الخروج</b></div></button>
      </div></div>
      <div class="rt" style="margin:14px 20px 10px">منشوراتي</div><div id="myposts"></div>
    </section>
  </main>
  <nav>
    <button class="on" data-s="chats"><img data-ic="chats" alt=""><span>المحادثات</span></button>
    <button data-s="stories"><img data-ic="stories" alt=""><span>الستوريات</span></button>
    <button data-t="الكاميرا 📸"><img data-ic="cam" alt=""><span>الكاميرا</span></button>
    <button data-s="prof"><img data-ic="prof" alt=""><span>ملفي</span></button>
  </nav>

  <div class="chat" id="chat">
    <div class="ch-h"><button class="btn ico" id="back" aria-label="رجوع">➜</button><div class="av" id="cav"></div><div><b id="cname"></b><small>متصل الآن</small></div></div>
    <div class="msgs" id="msgs"></div>
    <div class="compose"><input id="inp" placeholder="اكتب رسالة..."><button class="btn" id="send">إرسال</button></div>
  </div>

  <div class="viewer" id="viewer">
    <div class="bars" id="bars"></div>
    <div class="vh"><div class="av" id="vav"></div><b id="vname"></b><button class="btn" id="vx">إغلاق</button></div>
    <div class="vbody" id="vtxt"></div>
    <div class="vf" id="vf"><input id="vr" placeholder="ردّ على القصة..."><button class="btn ico" id="vl" aria-label="إعجاب">🤍</button><button class="btn" id="vs">إرسال</button></div>
  </div>
  <div class="ov" id="auth"><div class="acard">
    <img data-ic="logo" class="alogo" alt="">
    <h1 id="at"></h1><p id="ap"></p>
    <div id="a1"><input id="ph" dir="ltr" autocapitalize="off" placeholder="رقم الهاتف أو اليوزر" autocomplete="username"></div>
    <div id="a2" hidden><input id="pw" type="password" dir="ltr" placeholder="كلمة السر" autocomplete="current-password"></div>
    <div id="a3" hidden><input id="un" dir="ltr" autocapitalize="off" placeholder="اختر اسم المستخدم (يوزر)"><input id="pw2" type="password" dir="ltr" placeholder="كلمة سر (6 خانات على الأقل)" autocomplete="new-password"><input id="em" type="email" dir="ltr" placeholder="البريد الإلكتروني (اختياري)"></div>
    <div class="err" id="err" role="alert"></div>
    <button class="btn full" id="anext"></button>
    <button class="lnk" id="aback" hidden>رجوع</button>
  </div></div>
  <div id="splash"><img data-ic="logo" alt="NONO"></div>
  <div class="ov off" id="req"><div class="rwrap">
    <div class="rh"><button class="btn ico" id="rx" aria-label="رجوع">➜</button><h2>الأصدقاء والطلبات</h2></div>
    <div class="rcard"><b>ابحث</b><p>ابحث بيوزر أو اسم حساب أو رقم هاتف أو كلمة داخل القصص. والمحادثة تبدأ بعد موافقة الطرف الثاني.</p>
    <div class="mrow"><input id="fid" dir="auto" placeholder="يوزر، اسم، رقم، أو كلمة"><button class="btn" id="fsend">بحث</button></div><div class="err" id="ferr" role="alert"></div></div>
    <div id="rres"></div>
    <div class="rt">الطلبات الواردة</div><div id="rin"></div>
    <div class="rt">طلباتك المرسلة</div><div id="rout"></div>
  </div></div>
  <div class="ov off" id="sub"><div class="rwrap"><div class="rh"><button class="btn ico" id="sb" aria-label="رجوع">➜</button><h2 id="stt"></h2></div><div id="sbody"></div></div></div>
  <div class="ov off" id="thm"><div class="rwrap">
    <div class="rh"><button class="btn ico" id="tx" aria-label="رجوع">➜</button><h2>المظهر</h2></div>
    <div id="tlist"></div>
  </div></div>
  <div class="toast" id="toast"></div>
</div>

  $('plo').onclick=function(){T(api('/api/logout/all',{}).then(function(){toast('تم تسجيل الخروج من باقي الأجهزة')}))};

function sSaved(){shw('المحفوظات','<div id="svl"></div>',function(){T(api('/api/saved').then(function(l){$('svl').innerHTML=l.length?l.map(postH).join(''):'<p class="emp">ما عندك منشورات محفوظة. اضغط «حفظ» تحت أي منشور</p>'}))})}
function sPeople(t){

  T(api('/api/people?type='+t).then(function(l){$('pl').innerHTML=l.length?l.map(function(x){return '<div class="rq" data-u="'+esc(x.un)+'">'+av(x.un,x.av)+'<div class="m"><b>'+esc(x.name)+'</b><small dir="ltr">@'+esc(x.un)+'</small></div>'+(t==='friends'?'<button class="btn" data-op="'+esc(x.un)+'">محادثة</button>':t==='followers'?'<button class="btn g" data-rf="'+esc(x.un)+'">إزالة</button>':'<button class="btn g" data-fl="'+esc(x.un)+'">إلغاء المتابعة</button>')+'</div>'}).join(''):'<p class="emp">'+(t==='friends'?'ما عندك أصدقاء بعد':t==='followers'?'ما عندك متابعين بعد':'ما تتابع أحد بعد')+'</p>'}));
 });
}

 shw('@'+un,'<p class="emp">جارِ التحميل...</p>',function(){
  api('/api/user?u='+encodeURIComponent(un)).then(function(x){
   var me=x.un===U.un,c=x.counts,e=esc(x.un);
   var h='<div class="prof" style="padding-top:0"><div class="big">'+av(x.un,x.av)+'</div><h2>'+esc(x.name)+'</h2><p>@'+e+'</p>'+(x.bio?'<p class="pbio">'+esc(x.bio)+'</p>':'')+
   '<div class="stats"><div><b>'+c.posts+'</b><small>منشور</small></div><div><b>'+c.friends+'</b><small>صديق</small></div><div><b>'+c.followers+'</b><small>متابع</small></div><div><b>'+c.following+'</b><small>يتابع</small></div></div>';
   if(!me)h+='<div class="acts">'+(x.following?'<button class="btn g" data-fl="'+e+'">إلغاء المتابعة</button>':'<button class="btn" data-fo="'+e+'">متابعة</button>')+rel(x.rel,e)+(x.rel==='friend'?'<button class="btn g" data-uf="'+e+'">إلغاء الصداقة</button>':'')+'</div>';
   h+='</div>'+(x.priv?'<p class="emp" style="text-align:center">🔒 هذا الحساب خاص، أضفه كصديق حتى تشوف منشوراته</p>':x.posts.length?x.posts.map(postH).join(''):'<p class="emp" style="text-align:center">ما في منشورات بعد</p>');
   $('sbody').innerHTML=h;
  }).catch(function(x){$('sbody').innerHTML='<p class="emp">'+esc(x&&x.error||'خطأ')+'</p>'});
 });

 shw('التعليقات','<div id="cml"></div><div class="mrow" style="margin-top:12px"><input class="fld" id="cin" maxlength="300" placeholder="اكتب تعليق..." style="margin:0"><button class="btn" id="csend">نشر</button></div><div class="err" id="cerr" role="alert"></div>',function(){
  function ld(){api('/api/comments?id='+id).then(function(l){$('cml').innerHTML=l.length?l.map(function(c){return '<div class="rq" data-u="'+esc(c.un)+'">'+av(c.un,c.av)+'<div class="m"><b>'+esc(c.name)+'</b><small>'+ago(c.time)+'</small><div>'+esc(c.text)+'</div></div>'+(c.del?'<button class="btn g" data-cd="'+c.id+'" aria-label="حذف التعليق">🗑</button>':'')+'</div>'}).join(''):'<p class="emp">ما في تعليقات بعد، كن أول واحد</p>'}).catch(function(x){$('cerr').textContent=x&&x.error||''})}
  ld();
  $('csend').onclick=function(){var t=ptxt('cin');if(!t)return;api('/api/comments',{id:id,text:t}).then(function(){$('cin').value='';$('cerr').textContent='';ld();loadFeed();loadMine()}).catch(function(x){$('cerr').textContent=x&&x.error||'صار خطأ'})};
  $('cin').onkeydown=function(e){if(e.key==='Enter')$('csend').click()};
  $('cml').onclick=function(e){var b=e.target.closest('[data-cd]');if(!b)return;api('/api/comments/delete',{id:id,cid:b.dataset.cd}).then(function(){ld();loadFeed();loadMine()}).catch(function(x){toast(x&&x.error||'صار خطأ')})};
 });

/* منشورات */
function postH(p){
 return '<div class="post"><div class="ph" data-u="'+esc(p.un)+'">'+av(p.un,p.av)+'<div><b>'+esc(p.name)+'</b><small>@'+esc(p.un)+' · '+ago(p.time)+'</small></div></div>'+
 (p.text?'<div class="pt">'+esc(p.text)+'</div>':'')+(p.img?'<img class="pimg" loading="lazy" src="/api/img?id='+p.id+'" alt="">':'')+
 '<div class="pa"><button class="'+(p.liked?'on':'')+'" data-pl="'+p.id+'">'+(p.liked?'❤️':'🤍')+' '+p.likes+'</button><button data-pc="'+p.id+'">💬 '+p.cc+'</button><span class="sp"></span>'+(p.me?'<button data-pd="'+p.id+'" aria-label="حذف المنشور">🗑</button>':'')+'<button class="'+(p.saved?'on':'')+'" data-ps="'+p.id+'">🔖 '+(p.saved?'محفوظ':'حفظ')+'</button></div></div>';
}
function loadFeed(){if(!TOK)return;api('/api/posts').then(function(l){PS=l;$('feed').innerHTML=l.length?l.map(postH).join(''):'<p class="emp" style="text-align:center">ما في منشورات بعد. انشر أول منشور أو تابع ناس 🔥</p>'}).catch(function(){})}
function loadMine(){if(!U)return;api('/api/user?u='+encodeURIComponent(U.un)).then(function(x){$('myposts').innerHTML=x.posts.length?x.posts.map(postH).join(''):'<p class="emp" style="text-align:center">ما نشرت شي بعد</p>'}).catch(function(){})}

/* قصص: إعجاب ورد */

 var s=ST[i];if(!s)return;CS=s;seen[s.id]=1;drawStrip();
 $('vav').outerHTML=av(s.un,s.av).replace('class="av"','class="av" id="vav"');
 $('vname').textContent=s.me?'قصتك':s.name;$('vtxt').textContent=s.text;
 $('viewer').style.background='linear-gradient(160deg,'+s.color+' -40%,#1a0306 70%)';
 $('bars').innerHTML='<i><u id="pg"></u></i>';$('vr').value='';vl();$('viewer').classList.add('on');
 var w=0;clearInterval(timer);timer=setInterval(function(){if(document.activeElement===$('vr'))return;w+=2;$('pg').style.width=w+'%';if(w>=100)closeStory()},100);
}

/* ربط الأزرار */
document.addEventListener('click',function(e){
 var t=e.target,b,d;
 function q(s){b=t.closest(s);d=b&&b.dataset;return b}
 if(!U)return;
 if(q('[data-sg]')){document.querySelectorAll('[data-sg]').forEach(function(x){x.classList.toggle('on',x===b)});$('sg-st').hidden=d.sg!=='st';$('sg-po').hidden=d.sg!=='po';if(d.sg==='po')loadFeed()}
 else if(q('[data-s]')){if(d.s==='prof')loadMine();if(d.s==='stories'&&!$('sg-po').hidden)loadFeed()}
 else if(q('[data-x]')){var x=d.x;stack=[];
  if(x==='edit')opn(sEdit);else if(x==='notif')opn(sNotif);else if(x==='priv')opn(sPriv);else if(x==='help')opn(sHelp);else if(x==='saved')opn(sSaved);
  else if(x==='share'){var tx='@'+U.un;if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(tx).then(function(){toast('اننسخ يوزرك '+tx)},function(){toast(tx)});else toast(tx)}}
 else if(q('[data-pp]')){var k=d.pp;stack=[];opn(function(){sPeople(k)})}
 else if(q('[data-pt]')){var nt=d.pt;stack[stack.length-1]=function(){sPeople(nt)};rer()}
 else if(q('[data-tg]')){var kk=d.tg,on=!b.classList.contains('on'),body;
  b.classList.toggle('on',on);b.setAttribute('aria-checked',on?'true':'false');
  if(kk.indexOf('n.')===0){var nk=kk.slice(2);body={n:{}};body.n[nk]=on?1:0;U.set.n[nk]=on?1:0}else{body={};body[kk]=on?1:0;U.set[kk]=on?1:0}
  T(api('/api/me/settings',body))}
 else if(q('[data-pl]'))T(api('/api/posts/like',{id:d.pl}).then(rp));
 else if(q('[data-ps]'))T(api('/api/posts/save',{id:d.ps}).then(rp));
 else if(q('[data-pd]')){var pid=d.pd;if(confirm('حذف هذا المنشور؟'))T(api('/api/posts/delete',{id:pid}).then(function(){toast('انحذف المنشور');rp()}))}
 else if(q('[data-pc]')){var cid=d.pc;opn(function(){sComments(cid)})}
 else if(q('[data-fo],[data-fl]')){T(api('/api/follow',{to:d.fo||d.fl}).then(function(){rer();refresh()}))}
 else if(q('[data-uf]')){var uu=d.uf;if(confirm('إلغاء الصداقة مع @'+uu+'؟'))T(api('/api/unfriend',{to:uu}).then(function(){toast('انلغت الصداقة');rer();refresh()}))}
 else if(q('[data-rf]'))T(api('/api/followers/remove',{from:d.rf}).then(function(){rer();refresh()}));
 else if(q('[data-op]')){$('sub').classList.add('off');stack=[]}
 else if(q('[data-rq],[data-ok],[data-no],[data-cx]')){if(!$('sub').classList.contains('off'))setTimeout(rer,700)}
 else if(q('[data-u]')&&!t.closest('button')){var u=d.u;if($('sub').classList.contains('off'))stack=[];opn(function(){sUser(u)})}
});
fi();drawAll();go(1);TOK=ls('nono_tok');if(TOK)boot();
